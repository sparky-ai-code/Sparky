name: Sparky Voice PR

on:
  pull_request:
    paths:
      - "sparky-desktop/source/packages/contracts/src/settings.ts"
      - "sparky-desktop/source/apps/web/src/voice/**"
      - "sparky-desktop/source/apps/desktop/src/electron/ElectronProtocol*"
      - "sparky-desktop/source/apps/web/src/components/chat/ChatComposer.tsx"
      - "sparky-desktop/source/apps/web/src/components/ChatView.tsx"
      - "sparky-desktop/source/apps/web/src/components/settings/VoiceSettings*"
      - "sparky-desktop/source/apps/web/src/routes/settings.voice.tsx"
      - ".github/workflows/voice-calls.yml"

permissions:
  contents: read

jobs:
  targeted-tests:
    name: Voice unit tests and affected contracts
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sparky-desktop/source
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: sparky-desktop/source/pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --filter "./apps/*" --filter "./packages/*" --filter "./scripts"
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PUPPETEER_SKIP_DOWNLOAD: "true"
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Verify worker JavaScript parses
        run: |
          node --check apps/web/src/voice/tinyVoca.worker.js
          node --check apps/web/src/voice/whisper.worker.js
      - name: Guard against a separate voice call screen or phone button
        run: |
          if grep -Eq 'PhoneIcon|VoiceCall|voice call' apps/web/src/components/chat/ChatComposer.tsx apps/web/src/voice/VoiceSession.tsx; then
            echo "::error::Voice must stay inside the existing chat."
            exit 1
          fi
      - name: Verify Whisper CDN browser module imports resolve
        run: |
          node --input-type=module <<'NODE'
          const url = "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1/+esm";
          const response = await fetch(url, { signal: AbortSignal.timeout(45000) });
          if (!response.ok) throw new Error("Transformers ESM returned HTTP " + response.status);
          const js = await response.text();
          const imports = Array.from(js.matchAll(/(?:from\s*|import\s*\(\s*)["']([^"']+)["']/g), m => m[1]);
          const unresolved = imports.filter(spec => !spec.includes("${") && !/^(https?:\/\/|\/|\.\/|\.\.\/)/.test(spec));
          if (unresolved.length) throw new Error("Unresolved browser imports: " + unresolved.join(", "));
          if (!js.includes("export")) throw new Error("CDN did not return an ES module");
          console.log("Verified " + imports.length + " browser module imports");
          NODE
      - name: Test inline voice lifecycle, worker cancellation and settings
        run: pnpm --filter @sparky/web exec vp test run --project unit src/voice/voiceCall.logic.test.ts src/voice/voiceEngines.test.ts src/components/settings/VoiceSettings.test.ts
      - name: Test Electron desktop speech WebAssembly security policy
        run: pnpm --filter @sparky/desktop exec vp test run src/electron/ElectronProtocol.test.ts
      - name: Test shared settings contract
        run: pnpm --filter @sparky/contracts exec vp test run src/settings.test.ts
      # Run the real Whisper + Tiny Voca models with a public speech recording.
      # This is the regression test for an inactive voice button/blank chat feed.
      - name: Download public voice sample
        run: |
          curl --fail --location --retry 3 \
            "https://huggingface.co/datasets/Xenova/transformers.js-docs/resolve/main/jfk.wav" \
            -o apps/web/public/voice-test-utterance.wav
          test "$(wc -c < apps/web/public/voice-test-utterance.wav)" -gt 100000
      - name: Install headless Chromium
        run: pnpm --filter @sparky/desktop exec playwright-core install chromium --with-deps --only-shell
      - name: Smoke test real microphone capture, local transcription, automatic send and speech playback
        timeout-minutes: 12
        run: pnpm --filter @sparky/desktop exec node scripts/voice-smoke.mjs
      # Track existing main-branch compiler problems separately: fail on any
      # new error path so a voice regression cannot hide behind that baseline.
      - name: Typecheck web (fail for new diagnostic paths)
        shell: bash
        run: |
          if pnpm --filter @sparky/web typecheck > /tmp/voice-web-typecheck.log 2>&1; then
            cat /tmp/voice-web-typecheck.log
          else
            cat /tmp/voice-web-typecheck.log
            grep 'error TS' /tmp/voice-web-typecheck.log > /tmp/voice-errors.log || true
            if [ ! -s /tmp/voice-errors.log ]; then exit 1; fi
            if grep -Ev '^src/components/(DesktopUpdateBanner[.]tsx|settings/McpSettingsPanel[.]tsx|settings/SettingsPanels[.]tsx|settings/UserAnalyticsSettingsPanel[.]tsx)[(]' /tmp/voice-errors.log; then
              echo "::error::New web TypeScript errors."
              exit 1
            fi
            echo "::warning::Existing web TypeScript baseline errors remain."
          fi
