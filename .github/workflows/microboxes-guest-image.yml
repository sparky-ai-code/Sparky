name: Build Sparky Microboxes Linux guest
on:
  workflow_dispatch:
  push:
    paths:
      - "sparky-desktop/source/microboxes/os/**"
      - ".github/workflows/microboxes-guest-image.yml"

jobs:
  build-micro-linux:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: sparky-desktop/source
    steps:
      - uses: actions/checkout@v4
      # The GitHub-hosted Ubuntu image already contains these build tools.
      # Avoid a fragile apt update: mirrors occasionally fail in hosted runners.
      - name: Verify Buildroot host dependencies
        run: |
          set -eu
          for bin in gcc g++ make git wget curl rsync cpio unzip file bc bison flex python3 sha256sum; do
            command -v "$bin" >/dev/null || { echo "Missing build dependency: $bin"; exit 1; }
          done
      - name: Build standalone Sparky Micro Linux image
        run: bash microboxes/os/build-${{ matrix.arch }}.sh
        env:
          JOBS: "4"
      - name: Upload guest image (no publication)
        uses: actions/upload-artifact@v4
        with:
          name: sparky-micro-${{ matrix.arch }}
          path: sparky-desktop/source/dist/microboxes/sparky-micro-${{ matrix.arch }}/
          retention-days: 14

  smoke-guest:
    needs: build-micro-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            host-package: qemu-system-x86
          - arch: aarch64
            host-package: qemu-system-arm
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sparky-desktop/source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sparky-micro-${{ matrix.arch }}
          path: sparky-desktop/source/dist/microboxes/sparky-micro-${{ matrix.arch }}/
      - name: Verify VM boot-test dependencies
        run: |
          if ! command -v qemu-system-${{ matrix.arch }} >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y ${{ matrix.host-package }}
          fi
      - name: Capture a real guest framebuffer
        run: |
          node microboxes/os/smoke-boot.mjs \
            dist/microboxes/sparky-micro-${{ matrix.arch }} \
            dist/microboxes/screenshots
      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microboxes-smoke-${{ matrix.arch }}
          path: sparky-desktop/source/dist/microboxes/screenshots/
          if-no-files-found: ignore
          retention-days: 14
