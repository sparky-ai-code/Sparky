name: Build Windows Installer

on:
  pull_request:
  push:
    branches:
      - t3code/remove-nightly-update-track
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_wsl_node_pty:
    name: Build WSL node-pty
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Build Linux node-pty prebuild
        shell: bash
        run: |
          set -euo pipefail
          pty_pkg="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: ['$GITHUB_WORKSPACE/apps/server'] }))")"
          pty_dir="$(dirname "$pty_pkg")"
          ( cd "$pty_dir" && npx --yes node-gyp rebuild )
          mkdir -p wsl-prebuild
          cp "$pty_dir/build/Release/pty.node" wsl-prebuild/pty.node

      - name: Upload WSL node-pty prebuild
        uses: actions/upload-artifact@v7
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild/pty.node
          if-no-files-found: error

  build_installer:
    name: Build Windows x64 installer
    needs: build_wsl_node_pty
    runs-on: blacksmith-32vcpu-windows-2025
    timeout-minutes: 30
    env:
      T3CODE_NEON_AUTH_URL: ${{ vars.NEON_AUTH_URL }}
      T3CODE_NEON_AUTH_OAUTH_AUTHORIZE_URL: ${{ vars.NEON_AUTH_OAUTH_AUTHORIZE_URL }}
      T3CODE_NEON_AUTH_CLI_OAUTH_CLIENT_ID: ${{ vars.NEON_AUTH_CLI_OAUTH_CLIENT_ID }}
      T3CODE_RELAY_URL: ${{ vars.RELAY_DOMAIN != '' && format('https://{0}', vars.RELAY_DOMAIN) || (vars.RELAY_API_ZONE_NAME != '' && format('https://relay.{0}', vars.RELAY_API_ZONE_NAME)) }}
      VITE_SPARKY_ANALYTICS_ENDPOINT: https://artful-monitor-250.convex.site/analytics/event
      VITE_ACCOUNT_API_URL: ${{ vars.SPARKY_ACCOUNT_API_URL }}
      SPARKY_UPDATE_URL: ${{ vars.SPARKY_UPDATE_SITE_URL }}/updates/windows
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @sparky/desktop ensure:electron

      - name: Download WSL node-pty prebuild
        uses: actions/download-artifact@v8
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild

      - name: Resolve build version
        id: version
        shell: bash
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Build Windows installer
        shell: bash
        run: |
          vp run dist:desktop:artifact \
            --platform win \
            --target nsis \
            --arch x64 \
            --build-version "${{ steps.version.outputs.version }}" \
            --output-dir release \
            --wsl-prebuild "$GITHUB_WORKSPACE/wsl-prebuild/pty.node" \
            --verbose

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: sparky-windows-installer-${{ github.run_number }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
