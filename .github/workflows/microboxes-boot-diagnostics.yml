# Short diagnostic against the already-built GUI guest to inspect why Weston
# paints the screen but never emits a desktop-ready signal. No image rebuild.
name: Diagnose Microboxes GUI readiness
on:
  push:
    paths:
      - ".github/workflows/microboxes-boot-diagnostics.yml"
      - "sparky-desktop/source/microboxes/os/overlay/etc/init.d/S90sparky-micro"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose-gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            host-package: qemu-system-x86
          - arch: aarch64
            host-package: qemu-system-arm
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: sparky-desktop/source
    steps:
      - uses: actions/checkout@v4
      - name: Download existing compiled GUI image #16
        run: |
          mkdir -p dist/microboxes/sparky-micro-${{ matrix.arch }}
          gh run download 43230362940 --repo sparky-ai-code/Sparky \
            --name sparky-micro-${{ matrix.arch }} \
            --dir dist/microboxes/sparky-micro-${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install guest test runtime
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y ${{ matrix.host-package }} qemu-utils e2fsprogs
      # Modify an already-compiled test image on the runner. This does not
      # modify release artifacts or require rebuilding the Linux toolchain.
      - name: Probe Weston runtime socket and process lifecycle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("microboxes/os/overlay/etc/init.d/S90sparky-micro").read_text()
          needle = '      emit_console "SPARKY_MICRO_DESKTOP_ERROR: Weston did not open a display"'
          assert needle in source
          probe = """
                # Diagnostic only: report the actual Weston socket and process state.
                for d in /run/user/0 /run /tmp; do
                echo "SPARKY_DIAG_DIR: $d" > /dev/ttyS0 2>/dev/null || true
                ls -lan "$d" > /dev/ttyS0 2>/dev/null || true
                done
                echo "SPARKY_DIAG_PROCESSES:" > /dev/ttyS0 2>/dev/null || true
                ps -w > /dev/ttyS0 2>/dev/null || true
                echo "SPARKY_DIAG_LOG:" > /dev/ttyS0 2>/dev/null || true
                cat /var/log/sparky-micro-desktop.log > /dev/ttyS0 2>/dev/null || true
                echo "SPARKY_DIAG_DONE" > /dev/ttyS0 2>/dev/null || true
          """
          Path("/tmp/sparky-micro-diagnostic-init").write_text(source.replace(needle, probe + needle))
          PY
          disk=dist/microboxes/sparky-micro-${{ matrix.arch }}/rootfs.ext2
          sudo debugfs -w -R 'rm /etc/init.d/S90sparky-micro' "$disk"
          sudo debugfs -w -R 'write /tmp/sparky-micro-diagnostic-init /etc/init.d/S90sparky-micro' "$disk"
          sudo debugfs -w -R 'set_inode_field /etc/init.d/S90sparky-micro mode 0100755' "$disk"
          sudo debugfs -R 'stat /etc/init.d/S90sparky-micro' "$disk"
      - name: Record real boot status, Weston and seatd diagnostics
        env:
          SPARKY_MICRO_CAPTURE_GUEST_LOGS: "1"
          SPARKY_MICRO_VERIFY_GUI_INPUT: "1"
        run: |
          node microboxes/os/smoke-boot.mjs \
            dist/microboxes/sparky-micro-${{ matrix.arch }} \
            dist/microboxes/screenshots-${{ matrix.arch }}
      - name: Upload boot evidence even if Linux fails to start
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microboxes-gui-readiness-${{ matrix.arch }}
          path: sparky-desktop/source/dist/microboxes/screenshots-${{ matrix.arch }}/
          if-no-files-found: ignore
          retention-days: 7
