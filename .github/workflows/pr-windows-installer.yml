name: PR Windows installer (artifact only)

# Latest-commit-only test builds; superseded PR commits need no installer.
concurrency:
  group: sparky-pr-windows-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "sparky-desktop/source/apps/server/**"
      - "sparky-desktop/source/apps/desktop/**"
      - "sparky-desktop/source/apps/web/**"
      - "sparky-desktop/source/packages/**"
      - "sparky-desktop/source/scripts/**"
      - "sparky-desktop/source/pnpm-lock.yaml"
      - "sparky-desktop/source/pnpm-workspace.yaml"
      - "crates/sparky_cli/**"
      - ".github/workflows/pr-windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SPARKY_GITHUB_CLIENT_ID: ${{ vars.SPARKY_GITHUB_CLIENT_ID }}
  SPARKY_GITHUB_AUTH_BROKER_URL: ${{ vars.SPARKY_GITHUB_AUTH_BROKER_URL }}
  SPARKY_PLUGIN_WORKER_URL: ${{ vars.SPARKY_PLUGIN_WORKER_URL }}
  VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.SPARKY_CLERK_PUBLISHABLE_KEY }}
  VITE_SPARKY_PLUGIN_WORKER_URL: ${{ vars.SPARKY_PLUGIN_WORKER_URL }}
  SPARKY_UPDATE_URL: https://sparky.llc/get/updates/windows
  T3CODE_DESKTOP_SIGNED: 'false'
  NODE_ENV: production

jobs:
  build-micro-linux:
    name: Build and boot-verify bundled Linux guest
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: sparky-desktop/source
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified guest cache
        id: guest-cache
        uses: actions/cache@v4
        with:
          path: sparky-desktop/source/dist/microboxes/sparky-micro-x86_64
          key: microbox-x86_64-v2-${{ hashFiles('sparky-desktop/source/microboxes/os/**') }}
      - name: Verify Buildroot prerequisites
        if: steps.guest-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for bin in gcc g++ make git wget curl rsync cpio unzip file bc bison flex python3 sha256sum; do
            command -v "$bin" >/dev/null || { echo "Missing build tool: $bin"; exit 1; }
          done
      - name: Build Linux guest from this revision
        if: steps.guest-cache.outputs.cache-hit != 'true'
        run: bash microboxes/os/build-x86_64.sh
        env:
          JOBS: "4"
      - name: Verify bundled image checksums
        run: |
          cd dist/microboxes/sparky-micro-x86_64
          sha256sum -c SHA256SUMS
          grep -Fq '"boxImageVersion": 2' image.json
      - name: Install QEMU for guest acceptance
        run: |
          if ! command -v qemu-system-x86_64 >/dev/null || ! command -v qemu-img >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y qemu-system-x86 qemu-utils
          fi
      - name: Boot desktop and test mouse and keyboard
        env:
          SPARKY_MICRO_VERIFY_GUI_INPUT: "1"
        run: |
          node microboxes/os/smoke-boot.mjs \
            dist/microboxes/sparky-micro-x86_64 \
            dist/microboxes/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: sparky-micro-x86_64-bundled
          path: sparky-desktop/source/dist/microboxes/sparky-micro-x86_64/
          if-no-files-found: error
          retention-days: 1

  build-wsl-node-pty:
    name: Build Linux node-pty for WSL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sparky-desktop/source
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: sparky-desktop/source/pnpm-lock.yaml
      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile --filter "./apps/*" --filter "./packages/*" --filter "./scripts"
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Build Linux node-pty prebuild
        shell: bash
        run: |
          set -euo pipefail
          pty_pkg="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: [process.cwd() + '/apps/server'] }))")"
          pty_dir="$(dirname "$pty_pkg")"
          (cd "$pty_dir" && npx --yes node-gyp rebuild)
          mkdir -p "$RUNNER_TEMP/wsl-prebuild"
          cp "$pty_dir/build/Release/pty.node" "$RUNNER_TEMP/wsl-prebuild/pty.node"
          file "$RUNNER_TEMP/wsl-prebuild/pty.node"
      - uses: actions/upload-artifact@v4
        with:
          name: wsl-node-pty-x64
          path: ${{ runner.temp }}/wsl-prebuild/pty.node
          if-no-files-found: error
          retention-days: 1

  build-windows-x64:
    name: Build and upload Windows x64 installer
    needs: [build-wsl-node-pty, build-micro-linux]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sparky-desktop/source
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: sparky-desktop/source/pnpm-lock.yaml
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build Sparky CLI
        run: cargo build --release -p sparky_cli
        working-directory: .
      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile --filter "./apps/*" --filter "./packages/*" --filter "./scripts"
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - uses: actions/download-artifact@v4
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild
      - name: Build desktop application
        run: pnpm --config.verify-deps-before-run=false exec vp run --filter './apps/*' --filter './packages/*' --filter './oxlint-plugin-t3code' --filter './scripts' build
      - name: Verify GitHub OAuth bundle
        run: node scripts/verify-github-oauth-build.mjs
      - uses: actions/download-artifact@v4
        with:
          name: sparky-micro-x86_64-bundled
          path: sparky-desktop/source/dist/microboxes/sparky-micro-x86_64
      - name: Confirm image was staged for packaging
        shell: pwsh
        run: |
          $guest = 'dist/microboxes/sparky-micro-x86_64'
          foreach ($name in @('image.json', 'SHA256SUMS', 'rootfs.ext2', 'bzImage')) {
            if (!(Test-Path -LiteralPath (Join-Path $guest $name) -PathType Leaf)) {
              throw "Missing bundled guest: $name"
            }
          }
      - name: Build unsigned Windows installer
        run: pnpm --config.verify-deps-before-run=false dist:desktop:win:x64 --output-dir release-pr --wsl-prebuild "$env:GITHUB_WORKSPACE/wsl-prebuild/pty.node" --verbose
      - name: Verify installer
        shell: pwsh
        run: |
          $installer = 'release-pr/Sparky-x64.exe'
          if (!(Test-Path -LiteralPath $installer -PathType Leaf)) { throw "Missing Windows installer: $installer" }
          $hash = Get-FileHash $installer -Algorithm SHA256
          "SHA256: $($hash.Hash)"
          Get-ChildItem 'release-pr' | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: sparky-windows-installer-pr${{ github.event.pull_request.number || 'manual' }}-${{ github.run_number }}
          # A PR test install needs only the executable. The release updater
          # workflow retains blockmaps and feed manifests separately.
          path: sparky-desktop/source/release-pr/Sparky-x64.exe
          if-no-files-found: error
          # Installer executables are already compressed; recompressing the
          # artifact wastes runner time without meaningfully reducing upload.
          compression-level: 0
          retention-days: 14
