name: Global skill discovery

on:
  pull_request:
    paths:
      - ".github/workflows/global-skill-discovery.yml"
      - "crates/sparky_prompt/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prompt-tests:
    name: Prompt tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check prompt crate formatting
        run: cargo fmt --manifest-path crates/sparky_prompt/Cargo.toml -- --check
      - name: Run prompt tests
        run: cargo test --locked -p sparky_prompt
