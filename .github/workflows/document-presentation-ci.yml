name: Document and presentation authoring

on:
  pull_request:
    paths:
      - "crates/sparky_prompt/**"
      - "sparky-desktop/source/apps/web/src/components/files/**"
      - ".github/workflows/document-presentation-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prompt:
    name: Built-in agent authoring skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
      - name: Check Rust formatting
        run: cargo fmt --manifest-path crates/sparky_prompt/Cargo.toml -- --check
      - name: Test prompt and bundled skill injection
        run: cargo test --locked -p sparky_prompt

  web:
    name: Document and presentation UI tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sparky-desktop/source
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: sparky-desktop/source/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "./apps/*" --filter "./packages/*" --filter "./scripts"
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PUPPETEER_SKIP_DOWNLOAD: "true"
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Test artifact source, classification, and preview CSP
        run: pnpm --filter @sparky/web exec vp test run src/components/files/artifactFiles.test.ts src/components/files/FilePreviewPanel.test.ts
      - name: Type-check authoring changes against existing baseline diagnostics
        run: |
          set +e
          pnpm --filter @sparky/web typecheck > /tmp/web-typecheck.log 2>&1
          status=$?
          set -e
          cat /tmp/web-typecheck.log
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          # The repository already has full-web type errors unrelated to this
          # PR. Be strict about every new diagnostic, not only authoring files.
          grep -E '^src/.*: error TS[0-9]+:' /tmp/web-typecheck.log > /tmp/web-diagnostics.log || true
          if [ ! -s /tmp/web-diagnostics.log ]; then
            echo "::error::Typecheck failed without parseable diagnostics"
            exit 1
          fi
          grep -Ev '^src/components/DesktopUpdateBanner\.tsx\(88,52\): error TS2345:|^src/components/settings/McpSettingsPanel\.tsx\(69,15\): error TS377078:|^src/components/settings/SettingsPanels\.tsx\(599,42\): error TS2353:|^src/components/settings/UserAnalyticsSettingsPanel\.tsx\([0-9]+,[0-9]+\): error TS(18048|2322):' /tmp/web-diagnostics.log > /tmp/new-diagnostics.log || true
          if [ -s /tmp/new-diagnostics.log ]; then
            echo "::error::New web type errors found:"
            cat /tmp/new-diagnostics.log
            exit 1
          fi
          echo "::warning::Full-web typecheck retains pre-existing baseline errors in unrelated UI files; no new errors were found."
