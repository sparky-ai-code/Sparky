- GPT-6 Astra is discoverable through the model catalog for both API and OAuth-backed provider paths.
- Installer metadata remains compatible with the existing Sparky updater feeds and future releases.
- Updated the public documentation, release notes, and analytics/release administration surfaces.
"""
