name: Tiny Voca voice regression tests

on:
  pull_request:
    paths:
      - 'sparky-desktop/source/apps/web/src/voice/**'
      - 'sparky-desktop/source/apps/web/src/components/ChatView.tsx'
      - 'sparky-desktop/source/apps/web/src/components/chat/ChatComposer.tsx'
      - 'sparky-desktop/source/apps/web/src/components/settings/VoiceSettings.tsx'
      - 'sparky-desktop/source/apps/web/src/routes/settings.voice.tsx'
      - 'sparky-desktop/source/packages/contracts/src/settings*'
      - '.github/workflows/voice-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice-regression:
    name: Contract and voice tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sparky-desktop/source
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: sparky-desktop/source/pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --filter "./apps/*" --filter "./packages/*" --filter "./scripts"
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Check voice settings contracts
        run: pnpm --filter @sparky/contracts exec vp test run src/settings.test.ts
      - name: Check voice turn selection and formatting
        run: pnpm --filter @sparky/web exec vp test run src/voice/voiceSpeech.test.ts
      - name: Check local audio capture helpers
        run: pnpm --filter @sparky/web exec vp test run src/voice/voiceCapture.test.ts
      - name: Check voice worker JavaScript
        run: |
          node --check apps/web/src/voice/tinyVoca.worker.js
          node --check apps/web/src/voice/localSpeech.worker.js
      - name: Build web app and voice workers
        run: pnpm --filter @sparky/web build
      - name: Typecheck changed voice files (report existing unrelated errors)
        shell: bash
        run: |
          set +e
          pnpm --filter @sparky/web typecheck > /tmp/sparky-web-typecheck.log 2>&1
          status=$?
          set -e
          cat /tmp/sparky-web-typecheck.log
          if [ "$status" -ne 0 ]; then
            if grep -E 'src/(voice/|components/ChatView\.tsx|components/chat/ChatComposer\.tsx|components/settings/VoiceSettings\.tsx|routes/settings\.voice\.tsx)' /tmp/sparky-web-typecheck.log; then
              echo "::error::Voice change introduced a web typecheck error"
              exit 1
            fi
            echo "::warning::Web app typecheck still fails in unrelated pre-existing files; see full diagnostics."
          fi
