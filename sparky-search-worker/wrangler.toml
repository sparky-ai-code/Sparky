name = "sparky-search"
main = "src/index.js"
compatibility_date = "2026-08-31"
workers_dev = false

# Cloudflare-enforced per-client limit for the public native search route.
[[unsafe.bindings]]
name = "SEARCH_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Keep the Exa key out of this file:
#   npx wrangler secret put EXA_API_KEY
[vars]
ALLOWED_ORIGINS = "https://sparky.llc,https://www.sparky.llc"

# Route search requests through the canonical Sparky website domain. The
# existing Pages site continues serving every other path.
[[routes]]
pattern = "sparky.llc/search*"
zone_name = "sparky.llc"
