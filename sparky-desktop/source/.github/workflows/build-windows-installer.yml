name: Build Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_wsl_node_pty:
    name: Build WSL node-pty (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Build node-pty Linux prebuild
        shell: bash
        run: |
          set -euo pipefail
          pty_pkg="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: ['$GITHUB_WORKSPACE/apps/server'] }))")"
          pty_dir="$(dirname "$pty_pkg")"
          (cd "$pty_dir" && npx --yes node-gyp rebuild)
          mkdir -p wsl-prebuild
          cp "$pty_dir/build/Release/pty.node" wsl-prebuild/pty.node

      - name: Upload WSL node-pty prebuild
        uses: actions/upload-artifact@v7
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild/pty.node
          if-no-files-found: error
          retention-days: 1

  build_installer:
    name: Build Windows x64 installer
    needs: build_wsl_node_pty
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @sparky/desktop ensure:electron

      - name: Download WSL node-pty prebuild
        uses: actions/download-artifact@v8
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild

      - name: Build installer
        shell: bash
        run: |
          vp run dist:desktop:artifact --platform win --target nsis --arch x64 --wsl-prebuild "$GITHUB_WORKSPACE/wsl-prebuild/pty.node"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: sparky-windows-x64-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7
