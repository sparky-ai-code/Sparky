<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Sparky halftone sphere</title>
  <desc id="desc">A small-size cyan halftone sphere with enlarged dots on a transparent background.</desc>
  <defs>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.65" fill="#00B2FF"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="white"/>
      <stop offset="0.48" stop-color="white" stop-opacity="0.96"/>
      <stop offset="0.78" stop-color="white" stop-opacity="0.62"/>
      <stop offset="1" stop-color="white" stop-opacity="0.2"/>
    </linearGradient>
    <mask id="sphere-fade">
      <circle cx="32" cy="32" r="29" fill="url(#fade)"/>
    </mask>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#dots)" mask="url(#sphere-fade)"/>
</svg>
