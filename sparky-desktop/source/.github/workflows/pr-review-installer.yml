name: PR review Windows installer artifact

on:
  push:
    branches:
      - ci/pr-review-installer-*

permissions:
  contents: read

jobs:
  build_wsl_node_pty:
    name: Build Linux node-pty for WSL
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sparky-desktop/source
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sparky-desktop/source/pnpm-lock.yaml
      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile --filter "./apps/*" --filter "./packages/*" --filter "./scripts"
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PUPPETEER_SKIP_DOWNLOAD: "true"
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Build Linux node-pty prebuild
        shell: bash
        run: |
          set -euo pipefail
          pty_pkg="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: [process.cwd() + '/apps/server'] }))")"
          pty_dir="$(dirname "$pty_pkg")"
          (cd "$pty_dir" && npx --yes node-gyp rebuild)
          mkdir -p "$RUNNER_TEMP/wsl-prebuild"
          cp "$pty_dir/build/Release/pty.node" "$RUNNER_TEMP/wsl-prebuild/pty.node"
      - uses: actions/upload-artifact@v4
        with:
          name: pr-review-wsl-node-pty
          path: ${{ runner.temp }}/wsl-prebuild/pty.node
          if-no-files-found: error
          retention-days: 1

  build_windows_installer:
    name: Build Windows x64 installer
    needs: build_wsl_node_pty
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sparky-desktop/source
    env:
      SPARKY_UPDATE_URL: https://sparky.llc/get/updates/windows
      T3CODE_DESKTOP_SIGNED: "false"
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sparky-desktop/source/pnpm-lock.yaml
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build Sparky CLI
        run: cargo build --release -p sparky_cli
        working-directory: .
      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile --filter "./apps/*" --filter "./packages/*" --filter "./scripts"
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PUPPETEER_SKIP_DOWNLOAD: "true"
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - uses: actions/download-artifact@v4
        with:
          name: pr-review-wsl-node-pty
          path: wsl-prebuild
      - name: Build Windows installer
        run: pnpm --config.verify-deps-before-run=false dist:desktop:win:x64 --output-dir release-pr-review --wsl-prebuild "$env:GITHUB_WORKSPACE/wsl-prebuild/pty.node" --verbose
      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Resolve-Path 'release-pr-review/Sparky-x64.exe'
          Get-FileHash $installer -Algorithm SHA256
          Get-Item $installer | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: sparky-pr-review-windows-x64-${{ github.sha }}
          path: sparky-desktop/source/release-pr-review/Sparky-x64.exe
          if-no-files-found: error
          retention-days: 14
