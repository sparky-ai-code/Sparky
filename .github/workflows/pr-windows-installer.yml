name: PR Windows installer (artifact only)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "sparky-desktop/source/apps/server/**"
      - "sparky-desktop/source/apps/desktop/**"
      - "sparky-desktop/source/apps/web/**"
      - "sparky-desktop/source/packages/**"
      - "sparky-desktop/source/scripts/**"
      - "sparky-desktop/source/pnpm-lock.yaml"
      - "sparky-desktop/source/pnpm-workspace.yaml"
      - "crates/sparky_cli/**"
      - ".github/workflows/pr-windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SPARKY_GITHUB_CLIENT_ID: ${{ vars.SPARKY_GITHUB_CLIENT_ID }}
  SPARKY_GITHUB_AUTH_BROKER_URL: ${{ vars.SPARKY_GITHUB_AUTH_BROKER_URL }}
  SPARKY_PLUGIN_WORKER_URL: ${{ vars.SPARKY_PLUGIN_WORKER_URL }}
  VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.SPARKY_CLERK_PUBLISHABLE_KEY }}
  VITE_SPARKY_PLUGIN_WORKER_URL: ${{ vars.SPARKY_PLUGIN_WORKER_URL }}
  SPARKY_UPDATE_URL: https://sparky.llc/get/updates/windows
  T3CODE_DESKTOP_SIGNED: 'false'
  NODE_ENV: production

jobs:
  build-wsl-node-pty:
    name: Build Linux node-pty for WSL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sparky-desktop/source
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: sparky-desktop/source/pnpm-lock.yaml
      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile --filter "./apps/*" --filter "./packages/*" --filter "./scripts"
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Build Linux node-pty prebuild
        shell: bash
        run: |
          set -euo pipefail
          pty_pkg="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: [process.cwd() + '/apps/server'] }))")"
          pty_dir="$(dirname "$pty_pkg")"
          (cd "$pty_dir" && npx --yes node-gyp rebuild)
          mkdir -p "$RUNNER_TEMP/wsl-prebuild"
          cp "$pty_dir/build/Release/pty.node" "$RUNNER_TEMP/wsl-prebuild/pty.node"
          file "$RUNNER_TEMP/wsl-prebuild/pty.node"
      - uses: actions/upload-artifact@v4
        with:
          name: wsl-node-pty-x64
          path: ${{ runner.temp }}/wsl-prebuild/pty.node
          if-no-files-found: error
          retention-days: 1

  build-windows-x64:
    name: Build and upload Windows x64 installer
    needs: build-wsl-node-pty
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sparky-desktop/source
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: sparky-desktop/source/pnpm-lock.yaml
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build Sparky CLI
        run: cargo build --release -p sparky_cli
        working-directory: .
      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile --filter "./apps/*" --filter "./packages/*" --filter "./scripts"
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - uses: actions/download-artifact@v4
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild
      - name: Build desktop application
        run: pnpm --config.verify-deps-before-run=false exec vp run --filter './apps/*' --filter './packages/*' --filter './oxlint-plugin-t3code' --filter './scripts' build
      - name: Verify GitHub OAuth bundle
        run: node scripts/verify-github-oauth-build.mjs
      - name: Build unsigned Windows installer
        run: pnpm --config.verify-deps-before-run=false dist:desktop:win:x64 --output-dir release-pr --wsl-prebuild "$env:GITHUB_WORKSPACE/wsl-prebuild/pty.node" --verbose
      - name: Verify installer
        shell: pwsh
        run: |
          $installer = 'release-pr/Sparky-x64.exe'
          if (!(Test-Path -LiteralPath $installer -PathType Leaf)) { throw "Missing Windows installer: $installer" }
          $hash = Get-FileHash $installer -Algorithm SHA256
          "SHA256: $($hash.Hash)"
          Get-ChildItem 'release-pr' | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: sparky-windows-installer-pr${{ github.event.pull_request.number || 'manual' }}-${{ github.run_number }}
          path: |
            sparky-desktop/source/release-pr/Sparky-x64.exe
            sparky-desktop/source/release-pr/Sparky-x64.exe.blockmap
            sparky-desktop/source/release-pr/latest.yml
          if-no-files-found: error
          retention-days: 14
