name: Sparky Voice PR

on:
  pull_request:
    paths:
      - "sparky-desktop/source/packages/contracts/src/settings.ts"
      - "sparky-desktop/source/apps/web/src/voice/**"
      - "sparky-desktop/source/apps/web/src/components/chat/ChatComposer.tsx"
      - "sparky-desktop/source/apps/web/src/components/ChatView.tsx"
      - "sparky-desktop/source/apps/web/src/components/settings/VoiceSettings*"
      - "sparky-desktop/source/apps/web/src/routes/settings.voice.tsx"
      - ".github/workflows/voice-calls.yml"

permissions:
  contents: read

jobs:
  targeted-tests:
    name: Voice unit tests and affected contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sparky-desktop/source
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: sparky-desktop/source/pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --filter "./apps/*" --filter "./packages/*" --filter "./scripts"
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PUPPETEER_SKIP_DOWNLOAD: "true"
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Verify worker JavaScript parses
        run: |
          node --check apps/web/src/voice/tinyVoca.worker.js
          node --check apps/web/src/voice/whisper.worker.js
      - name: Test voice call lifecycle, worker cancellation and settings
        run: pnpm --filter @sparky/web exec vp test run --project unit src/voice/voiceCall.logic.test.ts src/voice/voiceEngines.test.ts src/components/settings/VoiceSettings.test.ts
      - name: Test shared settings contract
        run: pnpm --filter @sparky/contracts exec vp test run src/settings.test.ts
      # Track existing main-branch compiler problems separately: fail on any
      # new error path so a voice regression cannot hide behind that baseline.
      - name: Typecheck web (fail for new diagnostic paths)
        shell: bash
        run: |
          if pnpm --filter @sparky/web typecheck > /tmp/voice-web-typecheck.log 2>&1; then
            cat /tmp/voice-web-typecheck.log
          else
            cat /tmp/voice-web-typecheck.log
            grep 'error TS' /tmp/voice-web-typecheck.log > /tmp/voice-errors.log || true
            if [ ! -s /tmp/voice-errors.log ]; then exit 1; fi
            if grep -Ev '^src/components/(DesktopUpdateBanner[.]tsx|settings/McpSettingsPanel[.]tsx|settings/SettingsPanels[.]tsx|settings/UserAnalyticsSettingsPanel[.]tsx)[(]' /tmp/voice-errors.log; then
              echo "::error::New web TypeScript errors."
              exit 1
            fi
            echo "::warning::Existing web TypeScript baseline errors remain."
          fi
