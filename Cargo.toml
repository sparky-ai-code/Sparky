[workspace]
resolver = "2"
members = [
  "crates/sparky_config",
  "crates/sparky_ai",
  "crates/sparky_tools",
  "crates/sparky_session",
  "crates/sparky_memory",
  "crates/sparky_compaction",
  "crates/sparky_prompt",
  "crates/sparky_extensions",
  "crates/sparky_agent",
  "crates/sparky_cli",
]

[workspace.package]
version = "1.1.13"
edition = "2021"
authors = ["Sparky Team"]

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-stream = "0.1"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
url = "2.5"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

uuid = { version = "1.8", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
glob = "0.3"
walkdir = "2.5"
ignore = "0.4"
similar = "2.6"
boa_engine = "0.19"

clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
